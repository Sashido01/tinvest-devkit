[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinvest-devkit"
version = "0.1.1"
description = "Reusable read-only development tools for T-Invest API projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "t-tech-investments==1.49.3",
]

[project.scripts]
tinvest-devkit = "tinvest_devkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
