[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinvest-devkit"
version = "0.1.1"
description = "Reusable read-only development tools for T-Invest API projects"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "t-tech-investments @ https://github.com/Invest-SDK/invest-python/archive/5b3bcca6af9d3a4e0bc347261ee6f6493acfe814.zip#sha256=f2c167158ec3dbf3eff134817d46246c2c6b5df5258383ee2dfb7fb51dba9271",
]

[project.scripts]
tinvest-devkit = "tinvest_devkit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

